spring:
  application:
    name: funds-holding-analyser
#  profiles:
#    active : dev
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
  jpa:
    database: POSTGRESQL
    show-sql: true
  datasource:
    platform: postgres
    url : jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:funds-holding-analyser}
    #url: jdbc:postgresql://${MF_HOLDING_HOST:localhost}:5432/${MF_HOLDING_DB:funds-holding-analyser}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
    driverClassName: org.postgresql.Driver
  flyway:
    enabled: true
    shouldRepair: true
    connect-retries: 10
    schemas: public
    baseline-on-migration: true
    placeholderReplacement: false

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
  file:
    name : logs/myapp.log
    path : logs


data:
  extractor:
    months : 6
    max-retry : 5

internal:
  funds:
    vanguard:
      funds-links : https://investor.vanguard.com/investment-products/list/funddetail

kite:
  api-key: ${KITE_API_KEY:grovcnlnp7xoto0q}
  api-secret: ${KITE_API_SECRET:u303rsedv6xg6rl67qod588vuyzoyh15}
  base-url: https://api.kite.trade
  login-redirect-uri: http://127.0.0.1:8080/api/broker/callback
  sandbox: false

agent:
  enabled: ${AGENT_ENABLED:true}
  capital-per-cycle: ${AGENT_CAPITAL_PER_CYCLE:100000}
  stop-loss-pct: ${AGENT_STOP_LOSS_PCT:0.03}
  ladder-level1-pct: ${AGENT_LADDER_L1:0.05}
  ladder-level2-pct: ${AGENT_LADDER_L2:0.10}
  ladder-level3-pct: ${AGENT_LADDER_L3:0.15}
  ladder-exit-fraction: ${AGENT_LADDER_EXIT_FRACTION:0.33}
  eod-liquidate-below-floor: ${AGENT_EOD_LIQUIDATE:true}
  picks-per-cycle: ${AGENT_PICKS:5}
  monitor-interval-ms: ${AGENT_MONITOR_INTERVAL_MS:1000}


